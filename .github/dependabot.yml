version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Symfony releases move together; one pull request per week beats thirty.
      symfony:
        patterns:
          - "symfony/*"
          - "symfonycasts/*"
      doctrine:
        patterns:
          - "doctrine/*"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
