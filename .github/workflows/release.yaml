name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The tag is what people will run. It does not get published on trust.
  verify:
    name: Re-run the checks on the tag
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Build and publish the image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=YoutubeBoost
            org.opencontainers.image.description=Give the videos in your back catalogue a second life.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          # arm64 covers Raspberry Pi and Apple silicon hosts, which is where a
          # self-hosted tool like this often ends up.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub only stores attestations for public repositories (or Enterprise
      # ones). While the repository is private the step is skipped rather than
      # failing the release; it turns itself on the day the repository goes public.
      - name: Attest what was built
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Draft the release notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          body: |
            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Upgrading: read the README section on updating, then
            `docker compose -f compose.yaml -f compose.prod.yaml up -d --wait`.
