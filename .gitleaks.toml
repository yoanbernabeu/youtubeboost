# Secret scanning configuration.
#
# The rule set is the one gitleaks ships with; this file only records the single
# deliberate exception, so that a real leak is never lost in the noise of a known
# one.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  description = """
  APP_SECRET in .env.dev is generated by the Symfony Flex recipe and is meant to
  be committed. It signs sessions on a developer's own machine and grants access
  to nothing: the production instance sets its own APP_SECRET in .env.local,
  which is git-ignored. Every other .env file in the repository holds empty or
  placeholder values.
  """
  # Matches whether gitleaks reports a repository-relative or an absolute path.
  paths = ['''(^|/)\.env\.dev$''']
